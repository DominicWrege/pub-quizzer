name: "Nix Cache"
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: pub-quizzer
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          pathsToPush: "result-pub-quizzer"
      - run: |
          nix build .#pub-quizzer -o result-pub-quizzer
